<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵羽 Ling-Yu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>灵羽（Electron + CodeMirror）</h1>
      <div class="provider">
        <label for="providerSelect">LLM Manage</label>
        <select id="providerSelect">
          <option value="online">在线模型</option>
          <option value="local">本地模型</option>
        </select>
        <input id="webhookUrl" placeholder="Webhook URL (可选)" />
        <input id="webhookSecret" placeholder="Webhook Secret (可选)" />
        <button id="saveWebhookBtn" class="ghost-btn">保存告警Webhook</button>
        <button id="refreshHealthBtn" class="ghost-btn">刷新健康状态</button>
      </div>
    </header>

    <main>
      <section class="left-pane">
        <div id="editor"></div>
        <div class="actions">
          <button id="runPipeline">执行 Agent Pipeline</button>
          <button id="rememberBtn">写入长期记忆</button>
        </div>
      </section>

      <section class="right-pane">
        <h2>LLM 健康仪表盘</h2>
        <div id="llmHealthPanel" class="health-panel">
          <div id="healthSummary">加载中...</div>
          <pre id="healthMetrics"></pre>
          <ul id="healthAlerts" class="alerts"></ul>
        </div>
        <h2>执行日志</h2>
        <pre id="log"></pre>
        <h2>生成文档</h2>
        <pre id="doc"></pre>
      </section>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
