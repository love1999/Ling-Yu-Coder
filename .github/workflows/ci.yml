name: CI

on:
  push:
    branches:
      - main
      - work
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  test-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit + integration tests
        run: npm test

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Electron E2E smoke tests
        run: xvfb-run -a npm run test:e2e:smoke

  test-nightly-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Electron E2E full suite (retry once)
        run: xvfb-run -a npm run test:e2e:full || xvfb-run -a npm run test:e2e:full
